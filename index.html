<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transfer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .label {
            font-size: 14px;
            font-weight: 600;
            color: #646464;
            margin-bottom: 8px;
            display: block;
        }
        
        .input-group {
            display: flex;
            align-items: center;
            border: 2px solid #EFEFEF;
            border-radius: 14px;
            padding: 0 16px;
            height: 56px;
            background: white;
            transition: border-color 0.2s;
        }
        
        .input-group.active {
            border-color: #1E4DFF;
        }
        
        .input-group input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #000;
            min-width: 0;
        }
        
        .input-group input::placeholder {
            color: #999;
        }
        
        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .blue-text {
            color: #1E4DFF;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .clear-btn {
            width: 22px;
            height: 22px;
            background: #999;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .clear-btn.show {
            display: flex;
        }
        
        .clear-btn::after {
            content: '×';
            color: white;
            font-size: 18px;
            font-weight: 300;
            margin-top: -2px;
        }
        
        .network-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #F4F4F6;
            border-radius: 20px;
            padding: 10px 16px;
            min-height: 48px;
        }
        
        .network-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        
        .network-icon {
            font-size: 22px;
        }
        
        .network-select {
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            outline: none;
            cursor: pointer;
            flex: 1;
            padding: 4px 0;
        }
        
        .network-arrow {
            color: #999;
            font-size: 18px;
        }
        
        .token-label {
            color: #616469;
            font-size: 14px;
            font-weight: 500;
        }
        
        .approx-text {
            font-size: 13px;
            color: #9FA3A9;
            margin-top: 8px;
            font-weight: 500;
        }
        
        .footer {
            padding: 16px 20px 20px;
            border-top: 1px solid #EFEFEF;
            background: white;
        }
        
        .next-btn {
            width: 100%;
            height: 56px;
            background: #9DA3FF;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .next-btn.enabled {
            background: #1E4DFF;
        }
        
        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .next-btn:not(:disabled):hover {
            opacity: 0.9;
        }
        
        /* Fix for number input arrows */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Address Section -->
        <div class="section">
            <label class="label">Address or Domain Name</label>
            <div class="input-group" id="addrGroup">
                <input type="text" id="recipientInput" placeholder="Enter address">
                <div class="actions">
                    <div class="clear-btn" id="clearAddr"></div>
                    <span class="blue-text" id="pasteBtn">Paste</span>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E4DFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="4" width="14" height="16" rx="2"/>
                        <line x1="3" y1="8" x2="6" y2="8"/>
                        <line x1="3" y1="12" x2="6" y2="12"/>
                        <line x1="3" y1="16" x2="6" y2="16"/>
                    </svg>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E4DFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Network Section -->
        <div class="section">
            <label class="label">Destination network</label>
            <div class="network-pill">
                <div class="network-left">
                    <span class="network-icon" id="networkIcon">🟡</span>
                    <select class="network-select" id="networkSelect">
                        <!-- Will be populated by JavaScript -->
                    </select>
                </div>
                <span class="network-arrow">▼</span>
            </div>
        </div>

        <!-- Amount Section -->
        <div class="section">
            <label class="label">Amount</label>
            <div class="input-group" id="amountGroup">
                <input type="number" id="amountInput" placeholder="0.00" step="0.01">
                <div class="actions">
                    <div class="clear-btn" id="clearAmount"></div>
                    <span class="token-label" id="usdtLabel">USDT</span>
                    <span class="blue-text" id="maxBtn">Max</span>
                </div>
            </div>
            <div class="approx-text">≈ $<span id="usdLabel">0.00</span></div>
        </div>
    </div>

    <div class="footer">
        <button class="next-btn" id="nextBtn" disabled>Next</button>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
